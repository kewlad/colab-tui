name: Build & Release colab-tui (All Supported Platforms)

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (VPS, Desktop, Termux proot/chroot, Raspberry Pi, Routers)
          - goos: linux
            goarch: amd64
            name: colab-linux-x86_64
          - goos: linux
            goarch: "386"
            name: colab-linux-x86_32
          - goos: linux
            goarch: arm64
            name: colab-linux-arm64
          - goos: linux
            goarch: arm
            goarm: "7"
            name: colab-linux-armv7
          - goos: linux
            goarch: riscv64
            name: colab-linux-riscv64

          # Android (Native Termux — 32-bit/x86_64 Termux use colab-linux-armv7 / colab-linux-x86_64)
          - goos: android
            goarch: arm64
            name: colab-android-arm64

          # macOS (Apple Silicon & Intel Macs)
          - goos: darwin
            goarch: arm64
            name: colab-macos-arm64
          - goos: darwin
            goarch: amd64
            name: colab-macos-x86_64

          # FreeBSD (Servers & BSD Workstations)
          - goos: freebsd
            goarch: amd64
            name: colab-freebsd-x86_64
          - goos: freebsd
            goarch: arm64
            name: colab-freebsd-arm64

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Set up Go 1.25+
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build ${{ matrix.name }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm || '' }}
        run: go build -ldflags="-s -w" -o ${{ matrix.name }} ./cmd/colab

      - name: Upload workflow artifact (${{ matrix.name }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload combined bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: colab-all-platforms
          path: dist/

      - name: Publish atomic release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Prebuilt Binaries
          make_latest: "true"
          files: dist/*
